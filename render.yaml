services:
  # PostgreSQL Database
  - type: pserv
    name: fa-database
    plan: free
    
  # Redis for RQ
  - type: redis
    name: fa-redis
    plan: free
    ipAllowList: []

  # Single Container with All Services (Docker)
  - type: web
    name: fa-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fa-database
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fa-redis
          property: connectionString
      - key: APP_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_BASE
        value: https://fa-app.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://fa-app.onrender.com/auth/google/callback
      - key: HUBSPOT_REDIRECT_URI
        value: https://fa-app.onrender.com/auth/hubspot/callback
